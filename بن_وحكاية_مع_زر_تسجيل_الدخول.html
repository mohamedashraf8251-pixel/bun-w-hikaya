<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بُن وحكاية – المينيو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EAF0EB;--surface:#F7FAF7;--ink:#17332B;--muted:#5B6F67;--accent:#B57F16;--line:#BFCFC6;--hero:#17332B;--hero-ink:#EAF0EB;--hero-accent:#E3B04B;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1D19;--surface:#162823;--ink:#E6EEE9;--muted:#98ADA4;--accent:#E3B04B;--line:#2C443C;--hero:#0A1512;--hero-ink:#E6EEE9;--hero-accent:#E3B04B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1D19;--surface:#162823;--ink:#E6EEE9;--muted:#98ADA4;--accent:#E3B04B;--line:#2C443C;--hero:#0A1512;--hero-ink:#E6EEE9;--hero-accent:#E3B04B;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;font-size:17px;line-height:1.7}
header{background:var(--hero);color:var(--hero-ink);padding:56px 24px 48px;text-align:right}
.wrap{max-width:760px;margin:0 auto}
h1{font-family:"Reem Kufi",Tajawal,sans-serif;font-weight:700;font-size:clamp(3.2rem,13vw,6.5rem);line-height:1.05;margin:0 0 12px;color:var(--hero-accent)}
header p{margin:0;max-width:30em;font-size:1.1rem;opacity:.9}
.hours{margin-top:22px;font-size:.95rem;opacity:.75}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:8px;overflow-x:auto;padding:12px 24px;scrollbar-width:none}
#navrow{align-items:center}
#loginBtn{font:inherit;font-weight:700;white-space:nowrap;cursor:pointer;background:var(--accent);color:var(--hero);border:0;border-radius:999px;padding:6px 16px}
#tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1}
nav button{font:inherit;font-weight:500;white-space:nowrap;cursor:pointer;background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:6px 18px}
nav button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{padding:12px 24px 72px}
section{padding-top:36px}
h2{font-family:"Reem Kufi",Tajawal,sans-serif;font-size:1.9rem;margin:0 0 4px}
.note{color:var(--muted);margin:0 0 18px;font-size:.95rem}
ul{list-style:none;margin:0;padding:0}
li{padding:14px 0;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:baseline;gap:10px}
.name{font-weight:700;font-size:1.12rem}
.dots{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-4px);min-width:16px}
.price{font-weight:700;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.price small{font-weight:400;color:var(--muted);font-size:.8rem}
.desc{margin:2px 0 0;color:var(--muted);font-size:.95rem;max-width:34em}
.tag{display:inline-block;font-size:.78rem;font-weight:500;border:1px solid var(--accent);color:var(--accent);border-radius:6px;padding:0 7px;margin-inline-start:8px;vertical-align:middle}
footer{background:var(--surface);border-top:1px solid var(--line);padding:28px 24px;color:var(--muted);font-size:.92rem}
.mgr{position:fixed;inset-inline-start:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:9;font:inherit;font-weight:700;cursor:pointer;background:var(--accent);color:var(--hero);border:0;border-radius:999px;padding:12px 22px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.mgr[hidden]{display:none}
.del{font:inherit;font-size:.8rem;cursor:pointer;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 8px}
.del.sure{color:#B3261E;border-color:#B3261E}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);width:min(440px,92vw);padding:22px;font-family:inherit}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h3{font-family:"Reem Kufi",Tajawal,sans-serif;font-size:1.5rem;margin:0 0 10px}
dialog label{display:block;font-weight:500;font-size:.95rem;margin-top:12px}
dialog input,dialog select{display:block;width:100%;margin-top:4px;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px}
dialog input:focus-visible,dialog select:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.acts{display:flex;gap:10px;margin-top:18px}
.acts button{font:inherit;font-weight:700;cursor:pointer;border-radius:8px;padding:8px 20px;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg)}
.acts #cancel{background:transparent;color:var(--ink)}
#msg{min-height:1.4em;margin:10px 0 0;color:#B3261E;font-size:.9rem}
</style>
</head>
<body>
<header><div class="wrap">
<h1>بُن وحكاية</h1>
<p>قهوة مختصة محمّصة طازجة كل أسبوع، ومعاها حلويات متعمولة في المكان.</p>
<p class="hours">كل يوم من ٨ صباحًا حتى ١٢ منتصف الليل</p>
</div></header>

<nav aria-label="أقسام المينيو"><div class="wrap" id="navrow"><button id="loginBtn" type="button">🔐 تسجيل الدخول</button><div id="tabs"></div></div></nav>
<main><div class="wrap" id="menu"></div></main>
<footer><div class="wrap">الأسعار بالجنيه المصري وتشمل الضريبة. لو عندك حساسية من أي مكوّن، اسأل الباريستا قبل الطلب.</div></footer>
<button id="mgr" class="mgr" hidden>+ إضافة منتج</button>
<dialog id="loginDlg"><h3>تسجيل الدخول</h3><p id="loginInfo">سجّل الدخول بحسابك الأصلي للوصول إلى صلاحيات الإدارة.</p><p id="loginMsg" role="status"></p><div class="acts"><button id="loginAction">متابعة تسجيل الدخول</button><button id="loginClose">إغلاق</button></div></dialog>
<dialog id="dlg"><h3 id="dt">إضافة منتج جديد</h3>
<label>القسم<select id="fc"></select></label>
<label>اسم المنتج<input id="fn" maxlength="60"></label>
<label>الوصف (اختياري)<input id="fd" maxlength="120"></label>
<label>السعر بالجنيه<input id="fp" type="number" min="0" inputmode="numeric"></label>
<label>وسم (اختياري، مثل: جديد)<input id="ft" maxlength="16"></label>
<p id="msg" role="status"></p>
<div class="acts"><button id="save">حفظ المنتج</button><button id="cancel">إلغاء</button></div></dialog>

<script>
const MENU=[
{id:"hot",title:"مشروبات ساخنة",note:"بنحضّرها على بن مختص من محمصتنا.",items:[
["إسبريسو","شوت واحد مركّز وكريمة كثيفة.",45],
["أمريكانو","إسبريسو مع ماء ساخن، خفيف وصافي.",55],
["كابتشينو","إسبريسو وحليب مبخّر ورغوة كثيفة.",70,"الأكثر طلبًا"],
["لاتيه","حليب مخملي وإسبريسو هادي.",75],
["فلات وايت","شوتين إسبريسو مع حليب خفيف الرغوة.",80],
["قهوة تركي","على الطريقة التقليدية: سادة أو مظبوط أو زيادة.",40],
["شاي بالنعناع","أوراق نعناع طازجة وشاي أسود.",35],
["ساخن بالقرفة","حليب بالقرفة والعسل.",60]]},
{id:"cold",title:"مشروبات باردة",note:"منعشة لأيام الصيف الطويلة.",items:[
["آيس لاتيه","إسبريسو وحليب بارد على تلج.",80],
["كولد برو","منقوع ١٨ ساعة على البارد، ناعم وقليل المرارة.",85,"جديد"],
["آيس موكا","إسبريسو وشوكولاتة وحليب بارد.",90],
["ليمون بالنعناع","عصير ليمون طازج بالنعناع المهروس.",55],
["عصير مانجو","مانجو طبيعية من غير سكر مضاف.",70],
["سموذي فراولة","فراولة وزبادي وعسل.",75]]},
{id:"sweet",title:"حلويات",note:"بتتعمل يوميًا، والكمية محدودة.",items:[
["تشيز كيك","قاعدة بسكويت وتوبينج فراولة أو لوتس.",95,"الأكثر طلبًا"],
["براونيز","شوكولاتة داكنة ومكسرات، بتتقدم سخنة.",80],
["كرواسون بالزبدة","هش من بره وطري من جوه.",60],
["أم علي","بالمكسرات والقشطة، في طبق فخار.",85],
["كوكيز","رقاقة شوكولاتة وملح خفيف.",45]]},
{id:"food",title:"أكل خفيف",note:"تتقدم مع سلطة صغيرة.",items:[
["ساندوتش جبنة رومي","خبز ساوردو، جبنة رومي وطماطم.",90],
["ساندوتش ديك رومي","ديك رومي مدخن وجبنة شيدر وخس.",110],
["عجة بالجبنة","بيضتين مع جبنة وفلفل ألوان.",85],
["فول بالطحينة","الفطار المصري كما يجب، مع عيش بلدي.",65]]}
];
const tabs=document.getElementById("tabs"),menu=document.getElementById("menu");
let active="all",extra=[],flat=[],isMgr=false,db=null;
const nf=new Intl.NumberFormat("ar-EG");
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){
 const cats=[["all","الكل"],...MENU.map(c=>[c.id,c.title])];
 tabs.innerHTML=cats.map(([id,t])=>`<button data-id="${id}" aria-pressed="${id===active}">${t}</button>`).join("");
 const byId={};extra.forEach(e=>byId[e.id]=e);
 flat=[];
 MENU.forEach(c=>c.items.forEach(([n,d,p,t],i)=>{const id="o_"+c.id+"_"+i,o=byId[id];if(!o)flat.push({id,cat:c.id,name:n,desc:d,price:p,tag:t||""});else if(!o.hidden)flat.push({id,cat:o.cat||c.id,name:o.name,desc:o.desc||"",price:Number(o.price)||0,tag:o.tag||""})}));
 extra.filter(e=>!e.id.startsWith("o_")).forEach(e=>flat.push({id:e.id,cat:e.cat,name:e.name,desc:e.desc||"",price:Number(e.price)||0,tag:e.tag||""}));
 const all=MENU.map(c=>({...c,items:flat.filter(x=>x.cat===c.id).map(x=>[x.name,x.desc,x.price,x.tag,x.id])}));
 menu.innerHTML=all.filter(c=>active==="all"||c.id===active).map(c=>`
  <section id="${c.id}"><h2>${c.title}</h2><p class="note">${c.note}</p><ul>
  ${c.items.map(([n,d,p,t,id])=>`<li><div class="row"><span class="name">${esc(n)}${t?`<span class="tag">${esc(t)}</span>`:""}</span><span class="dots"></span><span class="price">${nf.format(p)} <small>جنيه</small></span>${id&&isMgr?`<button class="del" data-edit="${esc(id)}" aria-label="تعديل ${esc(n)}">تعديل</button><button class="del" data-del="${esc(id)}" aria-label="حذف ${esc(n)}">حذف</button>`:""}</div><p class="desc">${esc(d)}</p></li>`).join("")}
  </ul></section>`).join("");
}
tabs.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;active=b.dataset.id;render();window.scrollTo({top:0,behavior:"smooth"})});
render();

const dlg=document.getElementById("dlg"),mbtn=document.getElementById("mgr"),msg=document.getElementById("msg"),$=id=>document.getElementById(id);
let editId=null;
function openDlg(it){editId=it?it.id:null;$("dt").textContent=it?"تعديل المنتج":"إضافة منتج جديد";$("fc").value=it?it.cat:MENU[0].id;$("fn").value=it?it.name:"";$("fd").value=it&&it.desc?it.desc:"";$("fp").value=it?it.price:"";$("ft").value=it&&it.tag?it.tag:"";msg.textContent="";dlg.showModal();$("fn").focus()}
menu.addEventListener("click",async e=>{
 const eb=e.target.closest("[data-edit]");
 if(eb){const it=flat.find(x=>x.id===eb.dataset.edit);if(it)openDlg(it);return}
 const b=e.target.closest("[data-del]");if(!b||!db)return;
 if(!b.classList.contains("sure")){b.classList.add("sure");b.textContent="تأكيد الحذف";return}
 try{const k=b.dataset.del,ref=db.collection("menu").doc(k);if(k.startsWith("o_"))await ref.set({hidden:true,ts:Date.now()});else await ref.delete()}catch(err){b.textContent="تعذّر الحذف"}
});
mbtn.addEventListener("click",()=>openDlg(null));
$("cancel").addEventListener("click",()=>dlg.close());
$("save").addEventListener("click",async()=>{
 const name=$("fn").value.trim(),price=parseFloat($("fp").value);
 if(!name){msg.textContent="اكتب اسم المنتج.";return}
 if(!(price>=0)){msg.textContent="اكتب السعر بالأرقام.";return}
 try{
  const old=editId?extra.find(x=>x.id===editId):null;
  await db.collection("menu").doc(editId||"i"+Date.now().toString(36)).set({cat:$("fc").value,name,desc:$("fd").value.trim(),price,tag:$("ft").value.trim(),ts:old&&old.ts?old.ts:Date.now()});
  editId=null;
  ["fn","fd","fp","ft"].forEach(i=>$(i).value="");dlg.close();
 }catch(err){msg.textContent="تعذّر الحفظ. تأكد أنك مسجّل الدخول كمالك الصفحة."}
});
const loginDlg=$("loginDlg"),loginBtn=$("loginBtn");
loginBtn.addEventListener("click",async()=>{
  $("loginMsg").textContent="";
  if(!window.claude){$("loginMsg").textContent="تسجيل الدخول متاح من خلال بيئة الموقع الأصلية، وليس من ملف HTML مستقل.";loginDlg.showModal();return}
  try{
    const user=await claude.use("user");
    if(user && await user.canEdit()){
      $("loginInfo").textContent="أنت مسجّل بالفعل بحساب المدير.";
      $("loginMsg").textContent="صلاحيات المدير مفعّلة 👑";
      mbtn.hidden=false;
    }else{
      $("loginInfo").textContent="لم يتم التعرف على حساب المدير. جرّب متابعة تسجيل الدخول من المنصة.";
      $("loginMsg").textContent="لو المنصة توفر تسجيل دخول، افتحها من حسابك الأصلي.";
    }
  }catch(err){$("loginMsg").textContent="تعذّر التحقق من الحساب. افتح الموقع من بيئته الأصلية."}
  loginDlg.showModal();
});
$("loginAction").addEventListener("click",async()=>{
  try{
    if(window.claude?.login) await claude.login();
    else if(window.claude?.auth?.signIn) await claude.auth.signIn();
    else if(window.claude?.auth?.login) await claude.auth.login();
    else $("loginMsg").textContent="بيئة الموقع لا تعرض دالة تسجيل دخول مباشرة. افتح الموقع من المنصة الأصلية وسجّل الدخول هناك.";
  }catch(e){$("loginMsg").textContent="لم ينجح تسجيل الدخول، حاول من المنصة الأصلية."}
});
$("loginClose").addEventListener("click",()=>loginDlg.close());

(async()=>{
 try{
  if(!window.claude)return;
  const d=await claude.use("db");if(!d)return;
  db=d;
  const u=await claude.use("user");
  isMgr=u?await u.canEdit():false;
  $("fc").innerHTML=MENU.map(c=>`<option value="${c.id}">${c.title}</option>`).join("");
  mbtn.hidden=!isMgr;
  d.collection("menu").onSnapshot(s=>{extra=s.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>(a.ts||0)-(b.ts||0));render()},()=>{});
  render();
 }catch(err){}
})();
</script>
</body>
</html>
