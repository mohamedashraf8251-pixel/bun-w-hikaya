<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بُن وحكاية | منيو إلكتروني بتصميم عصري</title>
<meta name="description" content="منيو إلكتروني لمقهى بُن وحكاية. تجربة تصميم موقع متجاوب وأنيق للمشروعات الصغيرة.">
<meta name="theme-color" content="#17332B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EAF0EB;--surface:#F7FAF7;--ink:#17332B;--muted:#5B6F67;--accent:#B57F16;--line:#BFCFC6;--hero:#17332B;--hero-ink:#EAF0EB;--hero-accent:#E3B04B;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1D19;--surface:#162823;--ink:#E6EEE9;--muted:#98ADA4;--accent:#E3B04B;--line:#2C443C;--hero:#0A1512;--hero-ink:#E6EEE9;--hero-accent:#E3B04B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1D19;--surface:#162823;--ink:#E6EEE9;--muted:#98ADA4;--accent:#E3B04B;--line:#2C443C;--hero:#0A1512;--hero-ink:#E6EEE9;--hero-accent:#E3B04B;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;font-size:17px;line-height:1.7}
header{background:linear-gradient(135deg,var(--hero),#24483D);color:var(--hero-ink);padding:56px 24px 48px;text-align:right;position:relative;overflow:hidden}header:after{content:"☕";position:absolute;left:-18px;bottom:-48px;font-size:clamp(8rem,25vw,16rem);opacity:.07;pointer-events:none}
.wrap{max-width:760px;margin:0 auto}
h1{font-family:"Reem Kufi",Tajawal,sans-serif;font-weight:700;font-size:clamp(3.2rem,13vw,6.5rem);line-height:1.05;margin:0 0 12px;color:var(--hero-accent)}
header p{margin:0;max-width:30em;font-size:1.1rem;opacity:.9}
.hours{margin-top:22px;font-size:.95rem;opacity:.75}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:8px;overflow-x:auto;padding:12px 24px;scrollbar-width:none}
#navrow{align-items:center}
#signupTop{font:inherit;font-weight:700;white-space:nowrap;cursor:pointer;background:transparent;color:var(--ink);border:1.5px solid var(--accent);border-radius:999px;padding:6px 14px}
#loginBtn{font:inherit;font-weight:700;white-space:nowrap;cursor:pointer;background:var(--accent);color:var(--hero);border:0;border-radius:999px;padding:6px 16px}
#tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1}
nav button{font:inherit;font-weight:500;white-space:nowrap;cursor:pointer;background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:6px 18px}
nav button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{padding:12px 24px 72px}
section{padding:26px 22px 8px;margin:20px 0;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 5px 18px rgba(0,0,0,.04);animation:rise .35s ease both}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
h2{font-family:"Reem Kufi",Tajawal,sans-serif;font-size:1.9rem;margin:0 0 4px}
.note{color:var(--muted);margin:0 0 18px;font-size:.95rem}
ul{list-style:none;margin:0;padding:0}
li{padding:14px 0;border-bottom:1px solid var(--line)}li:last-child{border-bottom:0}
.row{display:flex;align-items:baseline;gap:10px}
.name{font-weight:700;font-size:1.12rem}
.dots{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-4px);min-width:16px}
.price{font-weight:700;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.price small{font-weight:400;color:var(--muted);font-size:.8rem}
.desc{margin:2px 0 0;color:var(--muted);font-size:.95rem;max-width:34em}
.tag{display:inline-block;font-size:.78rem;font-weight:500;border:1px solid var(--accent);color:var(--accent);border-radius:6px;padding:0 7px;margin-inline-start:8px;vertical-align:middle}
footer{background:var(--surface);border-top:1px solid var(--line);padding:28px 24px;color:var(--muted);font-size:.92rem}
.mgr{position:fixed;inset-inline-start:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:9;font:inherit;font-weight:700;cursor:pointer;background:var(--accent);color:var(--hero);border:0;border-radius:999px;padding:12px 22px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.mgr[hidden]{display:none}
.del{font:inherit;font-size:.8rem;cursor:pointer;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 8px}
.del.sure{color:#B3261E;border-color:#B3261E}
.auth-page{min-height:75vh;display:flex;align-items:center;justify-content:center;padding:28px 16px}.auth-page[hidden]{display:none!important}.auth-card{width:min(460px,100%);padding:28px 22px;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 35px rgba(0,0,0,.08)}.auth-card h2{text-align:center;margin:8px 0}.auth-card>p{text-align:center;color:var(--muted)}.auth-brand{text-align:center;font-size:2.6rem}.auth-card label{display:block;font-weight:600;margin-top:14px}.auth-card input{display:block;width:100%;margin-top:5px;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px}.auth-back{font:inherit;border:0;background:transparent;color:var(--muted);cursor:pointer}.auth-primary,.auth-switch{width:100%;font:inherit;font-weight:700;padding:12px;border-radius:10px;margin-top:12px;cursor:pointer}.auth-primary{background:var(--ink);color:var(--bg);border:1px solid var(--ink)}.auth-switch{background:transparent;color:var(--ink);border:1px solid var(--line)}dialog{border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);width:min(440px,92vw);padding:22px;font-family:inherit;box-shadow:0 18px 50px rgba(0,0,0,.2)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h3{font-family:"Reem Kufi",Tajawal,sans-serif;font-size:1.5rem;margin:0 0 10px}
dialog label{display:block;font-weight:500;font-size:.95rem;margin-top:12px}
dialog input,dialog select{display:block;width:100%;margin-top:4px;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px}
dialog input:focus-visible,dialog select:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.acts{display:flex;gap:10px;margin-top:18px}
.acts button{font:inherit;font-weight:700;cursor:pointer;border-radius:8px;padding:8px 20px;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg)}
.acts #cancel{background:transparent;color:var(--ink)}
#msg{min-height:1.4em;margin:10px 0 0;color:#B3261E;font-size:.9rem}\n@media(max-width:560px){header{padding:38px 20px 32px}main{padding:8px 14px 56px}section{padding:20px 14px 6px;margin:14px 0}nav .wrap{padding:10px 14px}.name{font-size:1rem}.mgr{padding:10px 18px}}\nbutton, .mgr{transition:transform .15s ease,filter .15s ease}button:hover,.mgr:hover{filter:brightness(1.05);transform:translateY(-1px)}


</style>
</head>
<body>
<header><div class="wrap">
<h1>بُن وحكاية</h1>
<p>قهوة مختصة محمّصة طازجة كل أسبوع، ومعاها حلويات متعمولة في المكان.</p>
<p class="hours">كل يوم من ٨ صباحًا حتى ١٢ منتصف الليل</p>
</div></header>

<nav aria-label="أقسام المينيو"><div class="wrap" id="navrow"><button id="loginBtn" type="button">🔐 تسجيل الدخول</button><button id="signupTop" type="button">إنشاء حساب</button><div id="tabs"></div></div></nav>
<main><div class="wrap" id="menu"></div></main>
<footer><div class="wrap">الأسعار بالجنيه المصري وتشمل الضريبة. لو عندك حساسية من أي مكوّن، اسأل الباريستا قبل الطلب.
</div></footer>
<button id="mgr" class="mgr" hidden>+ إضافة منتج</button>
<div id="authPage" class="auth-page" hidden><div class="auth-card"><button id="loginClose" class="auth-back" type="button">← رجوع للمنيو</button><div class="auth-brand">☕</div><h2 id="authTitle">تسجيل الدخول</h2><p id="loginInfo">سجّل الدخول أو أنشئ حسابًا جديدًا.</p><label>البريد الإلكتروني<input id="loginEmail" type="email" autocomplete="username" required></label><label>كلمة المرور<input id="loginPassword" type="password" autocomplete="current-password" required></label><p id="loginMsg" role="status"></p><button id="loginAction" class="auth-primary" type="button">دخول</button><button id="signupAction" class="auth-switch" type="button">إنشاء حساب جديد</button></div></div>
<dialog id="dlg"><h3 id="dt">إضافة منتج جديد</h3>
<label>القسم<select id="fc"></select></label>
<label>اسم المنتج<input id="fn" maxlength="60"></label>
<label>الوصف (اختياري)<input id="fd" maxlength="120"></label>
<label>السعر بالجنيه<input id="fp" type="number" min="0" inputmode="numeric"></label>
<label>وسم (اختياري، مثل: جديد)<input id="ft" maxlength="16"></label>
<p id="msg" role="status"></p>
<div class="acts"><button id="save">حفظ المنتج</button><button id="cancel">إلغاء</button></div></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const MENU=[
{id:"hot",title:"مشروبات ساخنة",note:"بنحضّرها على بن مختص من محمصتنا.",items:[
["إسبريسو","شوت واحد مركّز وكريمة كثيفة.",45],
["أمريكانو","إسبريسو مع ماء ساخن، خفيف وصافي.",55],
["كابتشينو","إسبريسو وحليب مبخّر ورغوة كثيفة.",70,"الأكثر طلبًا"],
["لاتيه","حليب مخملي وإسبريسو هادي.",75],
["فلات وايت","شوتين إسبريسو مع حليب خفيف الرغوة.",80],
["قهوة تركي","على الطريقة التقليدية: سادة أو مظبوط أو زيادة.",40],
["شاي بالنعناع","أوراق نعناع طازجة وشاي أسود.",35],
["ساخن بالقرفة","حليب بالقرفة والعسل.",60]]},
{id:"cold",title:"مشروبات باردة",note:"منعشة لأيام الصيف الطويلة.",items:[
["آيس لاتيه","إسبريسو وحليب بارد على تلج.",80],
["كولد برو","منقوع ١٨ ساعة على البارد، ناعم وقليل المرارة.",85,"جديد"],
["آيس موكا","إسبريسو وشوكولاتة وحليب بارد.",90],
["ليمون بالنعناع","عصير ليمون طازج بالنعناع المهروس.",55],
["عصير مانجو","مانجو طبيعية من غير سكر مضاف.",70],
["سموذي فراولة","فراولة وزبادي وعسل.",75]]},
{id:"sweet",title:"حلويات",note:"بتتعمل يوميًا، والكمية محدودة.",items:[
["تشيز كيك","قاعدة بسكويت وتوبينج فراولة أو لوتس.",95,"الأكثر طلبًا"],
["براونيز","شوكولاتة داكنة ومكسرات، بتتقدم سخنة.",80],
["كرواسون بالزبدة","هش من بره وطري من جوه.",60],
["أم علي","بالمكسرات والقشطة، في طبق فخار.",85],
["كوكيز","رقاقة شوكولاتة وملح خفيف.",45]]},
{id:"food",title:"أكل خفيف",note:"تتقدم مع سلطة صغيرة.",items:[
["ساندوتش جبنة رومي","خبز ساوردو، جبنة رومي وطماطم.",90],
["ساندوتش ديك رومي","ديك رومي مدخن وجبنة شيدر وخس.",110],
["عجة بالجبنة","بيضتين مع جبنة وفلفل ألوان.",85],
["فول بالطحينة","الفطار المصري كما يجب، مع عيش بلدي.",65]]}
];
const SUPABASE_URL="https://tblnzfdgedmxckutclc.supabase.co";
const SUPABASE_KEY="sb_publishable_RoPsIDXJfjp0N9J0qjTobw_VV9TnnQu";
const ADMIN_EMAIL="mohamedashraf8251@gmail.com";
const supabase=window.supabase?.createClient(SUPABASE_URL,SUPABASE_KEY)||null;
const tabs=document.getElementById("tabs"),menu=document.getElementById("menu");
let active="all",extra=[],flat=[],isMgr=false,session=null,authMode="login";
const nf=new Intl.NumberFormat("ar-EG");
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){
 const cats=[["all","الكل"],...MENU.map(c=>[c.id,c.title])];
 tabs.innerHTML=cats.map(([id,t])=>`<button data-id="${id}" aria-pressed="${id===active}">${t}</button>`).join("");
 const byId={};extra.forEach(e=>byId[e.id]=e);
 flat=[];
 MENU.forEach(c=>c.items.forEach(([n,d,p,t],i)=>{
  const id="o_"+c.id+"_"+i,o=byId[id];
  if(!o)flat.push({id,cat:c.id,name:n,desc:d,price:p,tag:t||""});
  else if(!o.hidden)flat.push({id,cat:o.cat||c.id,name:o.name,desc:o.description||"",price:Number(o.price)||0,tag:o.tag||""});
 }));
 extra.filter(e=>!e.id.startsWith("o_")&&!e.hidden).forEach(e=>flat.push({id:e.id,cat:e.cat,name:e.name,desc:e.description||"",price:Number(e.price)||0,tag:e.tag||""}));
 const all=MENU.map(c=>({...c,items:flat.filter(x=>x.cat===c.id).map(x=>[x.name,x.desc,x.price,x.tag,x.id])}));
 menu.innerHTML=all.filter(c=>active==="all"||c.id===active).map(c=>`
  <section id="${c.id}"><h2>${c.title}</h2><p class="note">${c.note}</p><ul>
  ${c.items.map(([n,d,p,t,id])=>`<li><div class="row"><span class="name">${esc(n)}${t?`<span class="tag">${esc(t)}</span>`:""}</span><span class="dots"></span><span class="price">${nf.format(p)} <small>جنيه</small></span>${id&&isMgr?`<button class="del" data-edit="${esc(id)}">تعديل</button><button class="del" data-del="${esc(id)}">حذف</button>`:""}</div><p class="desc">${esc(d)}</p></li>`).join("")}
  </ul></section>`).join("");
}
tabs.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;active=b.dataset.id;render();window.scrollTo({top:0,behavior:"smooth"})});
render();
const $=id=>document.getElementById(id);
const dlg=$("dlg"),authPage=$("authPage"),loginBtn=$("loginBtn"),signupTop=$("signupTop"),mbtn=$("mgr"),msg=$("msg");
let editId=null;
function openDlg(it){editId=it?it.id:null;$("dt").textContent=it?"تعديل المنتج":"إضافة منتج جديد";$("fc").value=it?it.cat:MENU[0].id;$("fn").value=it?it.name:"";$("fd").value=it&&it.desc?it.desc:"";$("fp").value=it?it.price:"";$("ft").value=it&&it.tag?it.tag:"";msg.textContent="";dlg.showModal();$("fn").focus()}
async function loadMenu(){if(!supabase)return;const {data,error}=await supabase.from("menu_items").select("*");if(error){console.error(error);return}extra=data||[];render()}
async function refreshAuth(){
 const {data}=await supabase.auth.getSession();session=data.session;
 isMgr=!!session&&session.user.email?.toLowerCase()===ADMIN_EMAIL.toLowerCase();
 mbtn.hidden=!isMgr;
 loginBtn.textContent=isMgr?"👑 المدير · تسجيل الخروج":"🔐 تسجيل الدخول";
 $("loginInfo").textContent=isMgr?"تم تسجيل الدخول بحساب المدير.":"سجّل الدخول بحساب المدير.";
 $("loginAction").textContent=isMgr?"تسجيل الخروج":(authMode==="signup"?"إنشاء الحساب":"دخول"); $("signupAction").textContent=authMode==="signup"?"لدي حساب بالفعل":"إنشاء حساب"; $("signupAction").hidden=isMgr;signupTop.hidden=isMgr;
}
function setAuthMode(mode){
 authMode=mode;
 $("loginMsg").textContent="";
 $("loginInfo").textContent=mode==="signup"?"إنشاء حساب جديد بالبريد الإلكتروني وكلمة المرور.":"سجّل الدخول بالبريد الإلكتروني وكلمة المرور.";
 $("loginAction").textContent=mode==="signup"?"إنشاء الحساب":"دخول";
 $("signupAction").textContent=mode==="signup"?"لدي حساب بالفعل":"إنشاء حساب";
 $("signupAction").hidden=isMgr;
}
function openAuthPage(mode){setAuthMode(mode);authPage.hidden=false;document.querySelector("header").hidden=true;document.querySelector("nav").hidden=true;document.querySelector("main").hidden=true;document.querySelector("footer").hidden=true;window.scrollTo(0,0);}
function closeAuth(){authPage.hidden=true;document.querySelector("header").hidden=false;document.querySelector("nav").hidden=false;document.querySelector("main").hidden=false;document.querySelector("footer").hidden=false;window.scrollTo(0,0);}
loginBtn.addEventListener("click",()=>openAuthPage("login"));
signupTop.addEventListener("click",()=>openAuthPage("signup"));
async function authInputs(){
 const email=$("loginEmail").value.trim(),password=$("loginPassword").value;
 if(!email||!password){$("loginMsg").textContent="اكتب البريد الإلكتروني وكلمة المرور.";return null}
 if(password.length<6){$("loginMsg").textContent="كلمة المرور لازم تكون 6 أحرف على الأقل.";return null}
 return {email,password};
}
$("loginAction").addEventListener("click",async()=>{
 if(isMgr){if(!supabase){$("loginMsg").textContent="الاتصال بخدمة الحسابات غير متاح.";return}await supabase.auth.signOut();await refreshAuth();closeAuth();return}
 if(!supabase){$("loginMsg").textContent="خدمة التسجيل لم تُحمّل. حدّث الصفحة أو جرّب لاحقًا.";return}
 const values=await authInputs();if(!values)return;
 $("loginAction").disabled=true;
 try{
  if(authMode==="signup"){
   const {data,error}=await supabase.auth.signUp(values);
   if(error){$("loginMsg").textContent="تعذّر إنشاء الحساب: "+error.message;return}
   if(data.session){await refreshAuth();closeAuth();await loadMenu();}
   else $("loginMsg").textContent="تم إنشاء الحساب. راجع بريدك لتأكيده إذا طُلب منك ذلك.";
  }else{
   const {error}=await supabase.auth.signInWithPassword(values);
   if(error){$("loginMsg").textContent="فشل تسجيل الدخول. راجع البريد وكلمة المرور.";return}
   await refreshAuth();closeAuth();await loadMenu();
  }
 }catch(err){$("loginMsg").textContent="حصل خطأ، حاول مرة أخرى."}
 finally{$("loginAction").disabled=false}
});
$("signupAction").addEventListener("click",()=>setAuthMode(authMode==="signup"?"login":"signup"));
$("loginClose").addEventListener("click",closeAuth);
$("fc").innerHTML=MENU.map(c=>`<option value="${c.id}">${c.title}</option>`).join("");
mbtn.addEventListener("click",()=>{if(isMgr)openDlg(null)});
menu.addEventListener("click",async e=>{
 const eb=e.target.closest("[data-edit]");if(eb){const it=flat.find(x=>x.id===eb.dataset.edit);if(it)openDlg(it);return}
 const b=e.target.closest("[data-del]");if(!b||!isMgr)return;
 if(!b.classList.contains("sure")){b.classList.add("sure");b.textContent="تأكيد الحذف";return}
 const id=b.dataset.del;
 if(id.startsWith("o_")){
  const parts=id.split("_"),catId=parts[1],idx=Number(parts[2]),cat=MENU.find(x=>x.id===catId),base=cat?.items[idx];
  if(!base){alert("المنتج الأصلي غير موجود");return}
  const {error}=await supabase.from("menu_items").upsert({id,cat:catId,name:base[0],description:base[1],price:base[2],tag:base[3]||"",hidden:true});
  if(error){b.textContent="تعذّر الحذف";alert(error.message);return}
 }else{
  const {error}=await supabase.from("menu_items").delete().eq("id",id);
  if(error){b.textContent="تعذّر الحذف";alert(error.message);return}
 }
 await loadMenu();
});
$("cancel").addEventListener("click",()=>dlg.close());
$("save").addEventListener("click",async()=>{
 if(!isMgr){msg.textContent="سجّل الدخول كمدير أولًا.";return}
 const name=$("fn").value.trim(),price=parseFloat($("fp").value);
 if(!name){msg.textContent="اكتب اسم المنتج.";return}
 if(!(price>=0)){msg.textContent="اكتب السعر بالأرقام.";return}
 const id=editId||"i"+Date.now().toString(36);
 const row={id,cat:$("fc").value,name,description:$("fd").value.trim(),price,tag:$("ft").value.trim(),hidden:false};
